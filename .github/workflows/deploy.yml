name: Build and Deploy Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Market News Update"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./Portfolio/package-lock.json"

      - name: Install dependencies
        run: |
          cd Portfolio
          npm ci

      - name: Build Next.js
        run: |
          cd Portfolio
          npm run build

      - name: Assemble public site
        run: |
          mkdir -p public_site
          # ルートの index.html と news ディレクトリをコピー
          cp index.html public_site/
          cp -r news public_site/
          # CUHK-X コンペの実験レポート（静的 HTML）
          cp -r cuhkx public_site/
          # ビルドされた Portfolio を public_site/Portfolio に配置
          cp -r Portfolio/out public_site/Portfolio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
